<!doctype html>
<html>
  <head>
    <title>Inline Style</title>
  </head>
  <body>
    <h1
      style="
        background-color: rgb(34, 186, 212);
        font-size: 30px;
        color: red;
        color: rgb(224, 37, 224);
      "
    >
      Heading <span style="color: goldenrod">1</span>
    </h1>
    <h2
      style="
        background-color: rgb(12, 156, 108);
        font-size: 30px;
        color: aquamarine;
      "
    >
      Heading 2
    </h2>
    <h3
      style="background-color: rgb(93, 102, 104); font-size: 30px; color: blue"
    >
      Heading 3
    </h3>
    <h4 style="background-color: rgb(48, 1, 1); font-size: 30px; color: green">
      Heading 4
    </h4>
    <h1
      style="
        background-color: rgb(20, 73, 55);
        font-size: 20px;
        color: rgba(255, 192, 17, 0.829);
      "
    >
      Heading 1
    </h1>
    <h2
      style="
        background-color: rgb(12, 156, 108);
        font-size: 20px;
        color: rgb(156, 95, 138);
        color: rgb(26, 49, 4);
      "
    >
      Heading 2
    </h2>
    <h3
      style="
        background-color: rgb(123, 23, 163);
        font-size: 20px;
        color: rgb(255, 28, 28);
      "
    >
      Heading 3
    </h3>
    <h4
      style="
        background-color: rgb(177, 83, 169);
        font-size: 20px;
        color: rgba(255, 194, 28, 0.582);
      "
    >
      Heading 4
    </h4>
  </body>
</html>
